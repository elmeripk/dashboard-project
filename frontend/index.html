<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/styles/style.css" />
  <title>dashboard</title>
</head>

<body>
  <main id="dashboard" class="manrope">
    <div id="toast-container"></div>
    <div id="date-container">
      <div id="clock-container" class="manrope-bold">
        <p id="clock-hours-minutes"></p>
        <p id="clock-seconds"></p>
      </div>
      <p id="date"></p>
    </div>

    <div id="weather-container" class="widget-container">

      <p class="loading">Loading weather for your location...</p>
      <div class="content">
        <h2 id="weather-container-header" class="widget-header-with-icon">
          <img src="map-pin.svg" alt="Location pin icon" class="icon" />
          <span id="weather-city-name"></span>
        </h2>
        <div>
          <div id="col-1">
            <img id="weather-icon" alt="" />
            <p id="weather-description"></p>
          </div>
          <div id="col-2">
            <p id="weather-temperature"></p>
          </div>
          <div id="col-3">
            <div>
              <div>
                <img src="sunrise-icon.svg" alt="Sunrise icon" class="icon" />
                <p>Sunrise</p>
              </div>
              <p class="manrope-bold" id="weather-sunrise"></p>
            </div>

            <div>
              <div>
                <img src="moon-icon.svg" alt="Sunset icon" class="icon" />
                <p>Sunset</p>
              </div>
              <p class="manrope-bold" id="weather-sunset"></p>
            </div>
            <div>
              <div>
                <img src="wind-icon.svg" alt="Wind icon" class="icon" />
                <p>Wind</p>
              </div>
              <p class="manrope-bold" id="weather-wind"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="nameday-container" class="widget-container">
      <p class="loading">Loading nameday...</p>
      <div class="content">
        <h2 id="nameday-header" class="widget-header-with-icon">
          <img src="birthday-cake-icon.svg" alt="Cake icon" class="icon" />
          <span id="nameday-header-text">Namedays for today</span>
        </h2>
        <section id="nameday-names">
          <div class="namelist">
            <h3 class="medium">Finnish</h3>
            <p id="nameday-finnish-names"></p>
          </div>
          <div class="namelist">
            <h3 class="medium">Swedish</h3>
            <p id="nameday-swedish-names"></p>
          </div>
        </section>
      </div>
    </div>

    <div id="transit-container" class="widget-container">
      <p class="loading italic normal">Loading transit info...</p>
      <div class="content">
        <h2 id="nameday-header" class="widget-header-with-icon">
          <img src="tram-icon.svg" alt="Transit icon" class="icon" />
          <span id="nameday-header-text">Transit information</span>
        </h2>
        <!--https://dev.to/siddev/customise-datalist-45p0-->
        <input list="transit-stops-datalist" id="transit-stop-input" placeholder="Start writing..." autocomplete="off" list=""/>
        <datalist id="transit-stops-datalist">
          <!-- Filled dynamically -->
        </datalist>
        <div id="transit-stops">
          <div class="next-arrival-1 arrival-entry">
            <p class="headsign manrope-bold"></p>
            <div class="times">
              <p class="scheduled-departure-time"></p>
              <p class="realtime-departure-time"></p>
            </div>
          </div>
          <div class="next-arrival-2 arrival-entry">
            <p class="headsign manrope-bold"></p>
            <div class="times">
              <p class="scheduled-departure-time"></p>
              <p class="realtime-departure-time"></p>
            </div>
       
          </div>
          <div class="next-arrival-3 arrival-entry">
            <p class="headsign manrope-bold"></p>
            <div class="times">
              <p class="scheduled-departure-time"></p>
              <p class="realtime-departure-time"></p>
            </div>
          </div>
        </div>
     
      </div>

    </div>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

<template id="toast-template">
  <div class="toast">

    <button class="toast-close-button">
      <img src="close-icon.svg" alt="Close icon" class="toast-button-icon"/>
    </button>

    <img class="toast-icon icon" />
    <p class="toast-message"></p>
  </div>

  </div>
</template>

</html>
